---
name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  qualify_code:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: npm ci
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --config .config/jest.config.js  # npm test

      - name: Lint desktop app
        run: npm run lint:desktop

      - name: Build desktop app
        run: npm run build:desktop

      - name: Install desktop test browser
        run: npx playwright install --with-deps chromium

      - name: Test desktop workflows
        run: npm run test:desktop

      # - name: Run tests with coverage
      #   run: |
      #     # npm install nyc --save-dev
      #     # npx nyc npm test
      #     npx jest --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TheNewThinkTank/biblio-sphere
          fail_ci_if_error: true

      # - name: Run ESLint
      #   run: npm run lint  # npx eslint src/ --config .config/.eslintrc.js
